<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Minds</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap">
<style>
:root{--bg:#040817;--panel:rgba(12,22,58,.62);--line:rgba(80,130,255,.28);--text:#e9f0ff;--muted:#8da2d8;--blue:#3b86ff;--glow:rgba(59,134,255,.55);--soft:rgba(59,134,255,.16);--ub:rgba(32,70,170,.55);--code:rgba(2,6,20,.7);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eaf1ff;--panel:rgba(255,255,255,.75);--line:rgba(60,110,230,.3);--text:#0c1a44;--muted:#4b5f95;--glow:rgba(59,134,255,.4);--soft:rgba(59,134,255,.12);--ub:rgba(190,212,255,.8);--code:rgba(236,242,255,.9);color-scheme:light}}
:root[data-theme="light"]{--bg:#eaf1ff;--panel:rgba(255,255,255,.75);--line:rgba(60,110,230,.3);--text:#0c1a44;--muted:#4b5f95;--glow:rgba(59,134,255,.4);--soft:rgba(59,134,255,.12);--ub:rgba(190,212,255,.8);--code:rgba(236,242,255,.9);color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Sora",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;overflow:hidden}
body::before,body::after{content:"";position:fixed;z-index:-1;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
body::before{background:radial-gradient(circle,#1d5cff,transparent 65%);left:-15vmax;bottom:-25vmax}
body::after{background:radial-gradient(circle,#00b4ff,transparent 65%);right:-20vmax;top:-30vmax;animation-delay:-9s;opacity:.35}
@keyframes drift{to{transform:translate(8vmax,-6vmax) scale(1.15)}}
button{font:inherit;color:inherit}
#side{width:264px;flex:0 0 264px;display:flex;flex-direction:column;gap:14px;padding:18px 12px;background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid var(--line)}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.02em;padding:0 8px;text-shadow:0 0 22px var(--glow)}
.send{border:0;border-radius:14px;padding:11px 18px;background:linear-gradient(135deg,#2f7bff,#00a2ff);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 0 20px var(--glow)}
.send:disabled{opacity:.5;cursor:default}
.new{width:100%}
#list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;border-radius:12px;border:1px solid transparent}
.item:hover{background:var(--soft)}
.item.on{border-color:var(--blue);box-shadow:0 0 16px var(--soft)}
.open{flex:1;min-width:0;text-align:left;background:none;border:0;font-size:.85rem;padding:10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:6px 10px}
.none{color:var(--muted);font-size:.85rem;padding:8px;margin:0}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 6px}
.pill{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:9px 16px;font-size:.82rem;font-weight:600;cursor:pointer;transition:box-shadow .2s,border-color .2s}
.pill:hover{border-color:var(--blue);box-shadow:0 0 16px var(--soft)}
.call{border-color:var(--blue);box-shadow:0 0 18px var(--glow)}
#toggle{display:none}
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.tab{border:0;background:none;border-radius:999px;padding:8px 18px;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:linear-gradient(135deg,#2f7bff,#00a2ff);color:#fff;box-shadow:0 0 18px var(--glow)}
.stage{flex:1;min-height:0;display:flex}
#chat{flex:1;overflow-y:auto;width:100%;max-width:820px;margin:0 auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px}
#work{display:none;flex:1.4;min-width:0;flex-direction:column;gap:8px;padding:8px 0 8px 16px}
body[data-mode="code"] #work{display:flex}
body[data-mode="code"] #chat{flex:0 0 380px;width:380px;max-width:none;margin:0}
.wbar{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.wbar .pill{padding:6px 14px;margin-left:6px}
#code{flex:1.2;min-height:0;resize:none;border:1px solid var(--line);border-radius:16px;background:var(--code);color:var(--text);padding:14px;font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;outline:0;tab-size:2}
#code:focus{border-color:var(--blue);box-shadow:0 0 22px var(--soft)}
#prev{flex:1;min-height:0;border:1px solid var(--line);border-radius:16px;background:#fff}
.empty{margin:auto;text-align:center;max-width:44ch;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{margin:0;font-size:clamp(1.4rem,3.4vw,2rem);letter-spacing:-.02em;text-shadow:0 0 30px var(--glow)}
.empty p{margin:0;color:var(--muted);line-height:1.5;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;font-size:.82rem;cursor:pointer}
.chip:hover{border-color:var(--blue);box-shadow:0 0 16px var(--soft)}
.msg{max-width:84%;padding:12px 16px;border-radius:18px;line-height:1.55;font-size:.93rem;border:1px solid var(--line);word-wrap:break-word;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.msg.user{align-self:flex-end;background:var(--ub);box-shadow:0 0 22px var(--soft)}
.msg.ai{align-self:flex-start;background:var(--panel)}
.who{display:block;font-size:.72rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.t{white-space:pre-wrap}
.msg img{max-width:100%;border-radius:12px;margin-top:8px;display:block}
.cb{margin:8px 0 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:.72rem;color:var(--muted);border-bottom:1px solid var(--line)}
.ch .pill{padding:4px 10px;font-size:.72rem;margin-left:4px}
.cb pre{margin:0;padding:10px;overflow-x:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace}
.dots span{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--blue);animation:b 1s infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.3}40%{opacity:1}}
.bar{width:100%;max-width:880px;margin:0 auto;padding:10px 16px 18px;display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.composer{flex:1 1 320px;display:flex;gap:8px;align-items:flex-end;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--blue);border-radius:22px;padding:8px 8px 8px 18px;box-shadow:0 0 26px var(--glow),0 0 80px var(--soft)}
#input{flex:1;resize:none;border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:.95rem;max-height:140px;padding:8px 0}
#input::placeholder{color:var(--muted)}
.ais{display:flex;gap:8px}
.ai{border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:.84rem;font-weight:600;padding:12px 15px;border-radius:16px;cursor:pointer;transition:box-shadow .2s,border-color .2s,color .2s}
.ai[aria-pressed="true"]{color:var(--text);border-color:var(--blue);box-shadow:0 0 20px var(--glow)}
#callUI{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:env(safe-area-inset-top,0px) 20px env(safe-area-inset-bottom,0px);background:rgba(3,7,22,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#e9f0ff;text-align:center}
#callUI[hidden]{display:none}
.orb{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8cc4ff,#2f7bff 55%,#0b2a8a);box-shadow:0 0 60px #3b86ff,0 0 140px rgba(59,134,255,.5)}
.orb.listen{animation:pl 2.4s ease-in-out infinite}.orb.think{animation:pl .8s ease-in-out infinite}.orb.speak{animation:pl 1.1s ease-in-out infinite;box-shadow:0 0 90px #5fa8ff,0 0 200px rgba(95,168,255,.6)}
@keyframes pl{50%{transform:scale(1.14)}}
#callUI h3{margin:0;font-size:1.4rem}#cs{margin:0;color:#8da2d8;max-width:34ch;min-height:2.6em}
.end{background:linear-gradient(135deg,#ff3b5c,#c4163a);box-shadow:0 0 22px rgba(255,59,92,.5)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
@media (max-width:860px){body[data-mode="code"] .stage{flex-direction:column;overflow-y:auto}body[data-mode="code"] #chat{flex:0 0 320px;width:100%;padding-top:8px}#work{padding:8px 16px;min-height:480px}}
@media (max-width:760px){#side{position:fixed;left:0;top:0;bottom:0;z-index:20;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}#toggle{display:inline-block}.tab{padding:8px 12px}.msg{max-width:94%}.ais{width:100%}.ai{flex:1}}
@media (prefers-reduced-motion:reduce){body::before,body::after,.dots span,.orb{animation:none!important}}
</style>
</head>
<body data-mode="chat">
<aside id="side" aria-label="Chat history">
  <div class="brand">Three Minds</div>
  <button class="send new" id="new">New chat</button>
  <div id="list"></div>
</aside>
<div class="main">
  <header>
    <button class="pill" id="toggle">History</button>
    <nav class="tabs"><button class="tab on" data-m="chat">Chat</button><button class="tab" data-m="code">Code space</button></nav>
    <button class="pill call" id="callBtn">Call</button>
  </header>
  <div class="stage">
    <section id="work">
      <div class="wbar"><span>index.html</span><span><button class="pill" id="run">Run</button><button class="pill" id="clr">Clear</button></span></div>
      <textarea id="code" spellcheck="false" aria-label="Code editor"></textarea>
      <iframe id="prev" sandbox="allow-scripts" title="Preview"></iframe>
    </section>
    <main id="chat" aria-live="polite"></main>
  </div>
  <div class="bar">
    <div class="composer"><textarea id="input" rows="1" aria-label="Message"></textarea><button class="send" id="send">Send</button></div>
    <div class="ais" role="group" aria-label="Choose an AI">
      <button class="ai" data-p="gemini" aria-pressed="true">Gemini</button>
    </div>
  </div>
</div>
<div id="callUI" hidden>
  <div class="orb" id="orb"></div><h3 id="cn">Claude</h3><p id="cs"></p>
  <button class="send end" id="endCall">End call</button>
</div>
<script>
(function(){
var API_URL="/api/chat";
var names={gemini:"Gemini"};
var provider="gemini",mode="chat";
var $=function(i){return document.getElementById(i)};
var chat=$("chat"),input=$("input"),send=$("send"),side=$("side"),listEl=$("list"),codeEl=$("code"),prev=$("prev");
var KEY="threeminds:v2",state={convos:[],current:null,code:{msgs:[],src:""}};
try{var raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw)||state}catch(e){}
if(!state.convos)state.convos=[];if(!state.code)state.code={msgs:[],src:""};
var STARTER="<!DOCTYPE html>\n<html>\n<body style=\"font-family:sans-serif;text-align:center;padding:40px\">\n  <h1>Hello, code space</h1>\n  <button onclick=\"this.textContent='Clicked!'\">Click me</button>\n</body>\n</html>";
codeEl.value=state.code.src||STARTER;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function find(id){return state.convos.find(function(c){return c.id===id})}

function renderList(){
  listEl.innerHTML="";
  if(!state.convos.length){var n=document.createElement("p");n.className="none";n.textContent="Your chats will show up here.";listEl.appendChild(n);return}
  state.convos.slice().sort(function(a,b){return b.updated-a.updated}).forEach(function(c){
    var row=document.createElement("div");row.className="item"+(c.id===state.current&&mode==="chat"?" on":"");
    var o=document.createElement("button");o.className="open";o.textContent=c.title;o.title=c.title;
    o.addEventListener("click",function(){state.current=c.id;setMode("chat")});
    var d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Delete chat");
    d.addEventListener("click",function(){state.convos=state.convos.filter(function(x){return x.id!==c.id});if(state.current===c.id)state.current=null;save();draw();renderList()});
    row.appendChild(o);row.appendChild(d);listEl.appendChild(row);
  });
}
function rich(el,text){
  el.innerHTML="";var re=/```(\w*)\n([\s\S]*?)```/g,last=0,m;
  function txt(s){if(!s.trim())return;var t=document.createElement("div");t.className="t";t.textContent=s.trim();el.appendChild(t)}
  while((m=re.exec(text))){txt(text.slice(last,m.index));block(el,m[1],m[2]);last=re.lastIndex}
  txt(text.slice(last));
}
function block(el,lang,src){
  var b=document.createElement("div");b.className="cb";
  var h=document.createElement("div");h.className="ch";
  var l=document.createElement("span");l.textContent=lang||"code";
  var bs=document.createElement("span");
  var u=document.createElement("button");u.className="pill";u.textContent="Use in editor";
  u.addEventListener("click",function(){codeEl.value=src;state.code.src=src;save();if(mode!=="code")setMode("code");prev.srcdoc=src});
  var c=document.createElement("button");c.className="pill";c.textContent="Copy";
  c.addEventListener("click",function(){try{navigator.clipboard.writeText(src);c.textContent="Copied"}catch(e){}});
  bs.appendChild(u);bs.appendChild(c);h.appendChild(l);h.appendChild(bs);
  var p=document.createElement("pre");p.textContent=src;
  b.appendChild(h);b.appendChild(p);el.appendChild(b);
}
function add(role,who,text,image){
  var e=$("empty");if(e)e.remove();
  var d=document.createElement("div");d.className="msg "+role;
  var w=document.createElement("span");w.className="who";w.textContent=who;
  var body=document.createElement("div");rich(body,text||"");
  d.appendChild(w);d.appendChild(body);
  if(image){var i=document.createElement("img");i.src=image;i.alt="Generated image";d.appendChild(i)}
  chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return{box:d,body:body};
}
function showEmpty(){
  chat.innerHTML="";var d=document.createElement("div");d.className="empty";d.id="empty";
  var h=document.createElement("h2"),p=document.createElement("p"),cs=document.createElement("div");cs.className="chips";
  var sug;
  if(mode==="code"){h.textContent="Build something together";p.textContent="Write code on the left, or describe what you want and use the code the AI returns.";sug=["Make a to-do app","Build a snake game","Explain my code"]}
  else{h.textContent="What should we make today?";p.textContent="Ask Gemini anything, or open Code space to build something together.";sug=["Plan a weekend trip","Explain black holes simply","Write a short story"]}
  sug.forEach(function(s){var b=document.createElement("button");b.className="chip";b.textContent=s;b.addEventListener("click",function(){input.value=s;input.focus()});cs.appendChild(b)});
  d.appendChild(h);d.appendChild(p);d.appendChild(cs);chat.appendChild(d);
}
function draw(){
  chat.innerHTML="";var msgs=mode==="code"?state.code.msgs:(find(state.current)||{msgs:[]}).msgs;
  if(!msgs.length)showEmpty();else msgs.forEach(function(m){add(m.role,m.who,m.text,m.image)});
  input.placeholder=mode==="code"?"Describe what to build or change…":"Type a message…";
}
function setMode(m){
  mode=m;document.body.dataset.mode=m;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("on",t.dataset.m===m)});
  side.classList.remove("open");draw();renderList();save();
}
function rec(role,who,text,image,id){
  var list,c;
  if(id==="code")list=state.code.msgs;
  else{c=id?find(id):find(state.current);if(id&&!c)return id;
    if(!c){c={id:Date.now().toString(36),title:text.slice(0,40),msgs:[],updated:0};state.convos.push(c);state.current=c.id}
    c.updated=Date.now();list=c.msgs}
  list.push({role:role,who:who,text:text,image:image||""});save();renderList();return c?c.id:"code";
}
function extract(d){
  if(!d)return{};
  if(d.content&&d.content[0]&&d.content[0].text)return{text:d.content[0].text};
  return{text:d.text||d.reply||"",image:d.image||""};
}
async function ask(p,prompt,voice){
  var body={provider:p,prompt:prompt};
  if(voice)body.system="You are on a live voice call. Answer in one to three short spoken sentences with no markdown.";
  else if(mode==="code"){body.system="You are a pair-programming partner. Give a brief explanation, then ONE complete runnable HTML/JS file in a single fenced code block.";body.code=codeEl.value}
  var r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("status "+r.status);
  return extract(await r.json());
}
async function go(){
  var prompt=input.value.trim();if(!prompt)return;
  input.value="";input.style.height="auto";
  var p=provider,cid=rec("user","You",prompt,"",mode==="code"?"code":null);
  add("user","You",prompt);
  var m=add("ai",names[p],"");m.body.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  send.disabled=true;
  try{
    var out=await ask(p,prompt,false),t=out.text||"No response came back.";
    rich(m.body,t);
    if(out.image){var i=document.createElement("img");i.src=out.image;i.alt="Generated image";m.box.appendChild(i)}
    rec("ai",names[p],t,out.image,cid);
  }catch(e){m.body.textContent="Couldn’t reach "+names[p]+". This page needs a backend at "+API_URL+" that holds your API keys and forwards the request."}
  send.disabled=false;chat.scrollTop=chat.scrollHeight;
}
/* ---- voice call ---- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition,inCall=false,busy=false,live=false,fatal=false,recog=null;
function status(t,c){$("cs").textContent=t;$("orb").className="orb "+(c||"")}
function listen(){
  if(!inCall||busy||live)return;live=true;status("Listening…","listen");
  recog=new SR();recog.lang=navigator.language||"en-US";recog.interimResults=false;
  recog.onresult=function(e){think(e.results[0][0].transcript)};
  recog.onerror=function(e){if(e.error==="not-allowed"||e.error==="service-not-allowed"){fatal=true;status("The microphone is blocked. Allow it in your browser settings, or open this page in its own tab.","")}};
  recog.onend=function(){live=false;if(inCall&&!busy&&!fatal)setTimeout(listen,350)};
  try{recog.start()}catch(e){live=false}
}
async function think(t){
  busy=true;status("Thinking…","think");var p=provider;
  var cid=rec("user","You",t,"",null);add("user","You",t);
  try{
    var out=await ask(p,t,true),reply=out.text||"Sorry, I didn’t get a reply.";
    add("ai",names[p],reply);rec("ai",names[p],reply,"",cid);
    if(!inCall)return;status("Speaking…","speak");
    var u=new SpeechSynthesisUtterance(reply);
    u.onend=u.onerror=function(){busy=false;listen()};speechSynthesis.speak(u);
  }catch(e){status("Couldn’t reach "+names[p]+". Check your backend.","");busy=false;setTimeout(listen,2500)}
}
function startCall(){
  $("cn").textContent=names[provider];$("callUI").hidden=false;
  if(!SR||!window.speechSynthesis){status("Voice calls need a browser with speech recognition, such as Chrome, Edge or Safari.","");return}
  if(mode!=="chat")setMode("chat");
  inCall=true;busy=false;live=false;fatal=false;listen();
}
function endCall(){
  inCall=false;try{if(recog)recog.abort()}catch(e){}
  try{speechSynthesis.cancel()}catch(e){}
  $("callUI").hidden=true;
}
/* ---- events ---- */
document.querySelectorAll(".ai").forEach(function(b){b.addEventListener("click",function(){
  provider=b.dataset.p;document.querySelectorAll(".ai").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))})})});
document.querySelectorAll(".tab").forEach(function(t){t.addEventListener("click",function(){setMode(t.dataset.m)})});
$("new").addEventListener("click",function(){state.current=null;setMode("chat");input.focus()});
$("toggle").addEventListener("click",function(){side.classList.toggle("open")});
$("callBtn").addEventListener("click",startCall);$("endCall").addEventListener("click",endCall);
$("run").addEventListener("click",function(){prev.srcdoc=codeEl.value});
$("clr").addEventListener("click",function(){codeEl.value="";state.code.src="";save();prev.srcdoc=""});
codeEl.addEventListener("input",function(){state.code.src=codeEl.value;save()});
codeEl.addEventListener("keydown",function(e){if(e.key==="Tab"){e.preventDefault();var s=codeEl.selectionStart;codeEl.setRangeText("  ",s,codeEl.selectionEnd,"end")}});
send.addEventListener("click",go);
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go()}});
input.addEventListener("input",function(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
prev.srcdoc=codeEl.value;draw();renderList();
})();
</script>
</body>
</html>
